  <style>
    :root {
      --branco-gelo: #FFFFFF;
      --preto-grafite: #1F1F1F;
      --cinza-claro: #F5F5F5;
      --azul-claro: #0B4870;
    }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--preto-grafite);
      background: var(--branco-gelo);
      overflow-x: hidden;
    }

    .font-display {
      font-family: 'Playfair Display', serif;
    }

    @media (max-width: 640px) {

      input,
      select,
      textarea,
      button {
        font-size: 16px !important;
      }
    }

    .btn-gold {
      background: var(--azul-claro);
      color: #FFFFFF;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -8px rgba(11, 72, 112, .55);
    }

    .btn-outline-gold {
      border: 1.5px solid var(--azul-claro);
      color: var(--preto-grafite);
      transition: background .2s ease;
    }

    .btn-outline-gold:hover {
      background: rgba(11, 72, 112, .08);
    }

    .card {
      border: 1px solid transparent;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      border-color: var(--azul-claro);
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -20px rgba(11, 72, 112, .15);
    }

    .fade-up {
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-up {
        animation: none;
      }

      .btn-gold:hover,
      .card:hover {
        transform: none;
      }
    }

    .img-blur {
      filter: blur(18px);
      transition: filter .7s ease-out;
    }

    .img-blur.img-blur-loaded {
      filter: blur(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .img-blur {
        filter: none;
        transition: none;
      }
    }

    /* PÍLULA DE CATEGORIA */
    .cat-tab {
      border: 1.5px solid var(--line);
      color: var(--preto-grafite);
      transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
      white-space: nowrap;
    }

    .cat-tab:hover {
      border-color: var(--azul-claro);
      transform: translateY(-1px);
    }

    .cat-tab.active {
      background: var(--azul-claro);
      border-color: var(--azul-claro);
      color: #FFFFFF;
    }

    /* ALTERNÂNCIA BAIXO / ALTO CUSTO */
    .cost-toggle-btn {
      transition: background .2s ease, color .2s ease;
      color: #6B6B6B;
    }

    .cost-toggle-btn.active {
      background: #FFFFFF;
      color: var(--azul-claro);
      box-shadow: 0 6px 16px -8px rgba(11, 72, 112, .35);
    }

    .cat-panel {
      display: none;
    }

    .cat-panel.active {
      display: block;
    }

    .price-pill {
      background: rgba(11, 72, 112, .1);
      color: var(--azul-claro);
    }
  </style>
</head>

    function imgSrc(v) {
      const val = v.imagem || v.img || '';
      if (/^https?:\/\//i.test(val)) return val;
      return `https://placehold.co/600x400/1F1F1F/FFFFFF?text=${encodeURIComponent(val || v.nome)}&font=playfair-display`;
    }

    function contactLinks(v) {
      const items = [];
      if (v.whatsapp) items.push({ label: 'WhatsApp', href: `https://wa.me/${v.whatsapp.replace(/\D/g, '')}` });
      if (v.telefone) items.push({ label: 'Telefone', href: `tel:${v.telefone.replace(/\s+/g, '')}` });
      if (v.email) items.push({ label: 'E-mail', href: `mailto:${v.email}` });
      if (v.link) items.push({ label: 'Site', href: v.link });
      if (!items.length) return '';
      return `<div class="flex flex-wrap gap-2 mt-3">${items.map(i =>
        `<a href="${i.href}" target="_blank" rel="noopener" class="text-xs font-semibold text-primary underline underline-offset-2">${i.label}</a>`
      ).join('')}</div>`;
    }

    function vendorCard(v) {
      return `
        <div class="card fade-up bg-white rounded-2xl overflow-hidden border border-black/5">
          <div class="h-36 sm:h-40 overflow-hidden">
            <img src="${imgSrc(v)}"
              alt="${v.nome}" class="img-blur w-full h-full object-cover"
              onload="this.classList.add('img-blur-loaded')">
          </div>
          <div class="p-4 sm:p-5">
            <h4 class="font-display text-base sm:text-lg mb-1">${v.nome}</h4>
            <p class="text-sm text-[#555] leading-relaxed mb-3">${v.desc}</p>
            <span class="price-pill inline-block text-xs font-semibold px-3 py-1.5 rounded-full">${v.preco}</span>
            ${v.endereco ? `<p class="text-xs text-[#8A8A8A] mt-2">${v.endereco}</p>` : ''}
            ${contactLinks(v)}
          </div>
        </div>`;
    }

    function buildPanel(cat) {
      return `
        <div class="cat-panel" id="panel-${cat.slug}" data-slug="${cat.slug}">
          <div class="mb-5 sm:mb-8">
            <h2 class="font-display text-xl sm:text-3xl mb-2">${cat.nome}</h2>
            <p class="text-sm sm:text-base text-[#555] leading-relaxed">${cat.desc}</p>
          </div>

          <div class="grid grid-cols-2 sm:inline-flex bg-mist rounded-full p-1 mb-6 sm:mb-8">
            <button type="button" class="cost-toggle-btn active px-4 sm:px-5 h-11 sm:h-auto sm:py-2 rounded-full text-sm font-semibold" data-cost="baixo">
              Baixo custo
            </button>
            <button type="button" class="cost-toggle-btn px-4 sm:px-5 h-11 sm:h-auto sm:py-2 rounded-full text-sm font-semibold" data-cost="alto">
              Alto custo
            </button>
          </div>

          <div class="cost-group grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6" data-cost="baixo">
            ${cat.baixo.map(vendorCard).join('')}
          </div>
          <div class="cost-group hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6" data-cost="alto">
            ${cat.alto.map(vendorCard).join('')}
          </div>
        </div>`;
    }

    function selectCategory(slug) {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.slug === slug));
      document.querySelectorAll('.cat-panel').forEach(p => p.classList.toggle('active', p.dataset.slug === slug));
    }

    function onlyVisible(list) {
      return (list || []).filter(v => v.ativo !== false);
    }

    function renderCategorias(categorias) {
      tabsEl.innerHTML = '';
      panelsEl.innerHTML = '';

      categorias.forEach((catRaw, i) => {
        const cat = {
          ...catRaw,
          icon: catRaw.icon || ICON_PRESETS[catRaw.icone] || ICON_PRESETS.geral,
          baixo: onlyVisible(catRaw.baixo),
          alto: onlyVisible(catRaw.alto),
        };

        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'cat-tab snap-start flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-5 h-10 sm:h-auto sm:py-2.5 rounded-full text-xs sm:text-sm font-medium shrink-0' + (i === 0 ? ' active' : '');
        tab.dataset.slug = cat.slug;
        tab.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${cat.icon}</svg><span>${cat.nome}</span>`;
        tabsEl.appendChild(tab);

        const panelWrapper = document.createElement('div');
        panelWrapper.innerHTML = buildPanel(cat);
        const panel = panelWrapper.firstElementChild;
        if (i === 0) panel.classList.add('active');
        panelsEl.appendChild(panel);
      });

      tabsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-tab');
        if (!btn) return;
        selectCategory(btn.dataset.slug);
        history.replaceState(null, '', `?cat=${btn.dataset.slug}`);
      });

      panelsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.cost-toggle-btn');
        if (!btn) return;
        const panel = btn.closest('.cat-panel');
        panel.querySelectorAll('.cost-toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
        panel.querySelectorAll('.cost-group').forEach(g => g.classList.toggle('hidden', g.dataset.cost !== btn.dataset.cost));
      });

      // Pré-selecionar categoria a partir do parâmetro ?cat= na URL
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('cat');
      if (catParam && categorias.some(c => c.slug === catParam)) {
        selectCategory(catParam);
        const activeTab = document.querySelector(`.cat-tab[data-slug="${catParam}"]`);
        if (activeTab) activeTab.scrollIntoView({ inline: 'center', block: 'nearest' });
      }
    }

    // Carrega os fornecedores de fornecedores-data.json (editável através do
    // Painel de administração). Se o ficheiro não existir ou não puder ser lido
    // — por exemplo, ao abrir esta página diretamente no computador sem um
    // servidor — usa os dados de reserva incluídos neste ficheiro.
    (async function bootstrap() {
      let categorias = CATEGORIAS_RESERVA;
      try {
        const res = await fetch('./fornecedores-data.json', { cache: 'no-store' });
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length) categorias = json;
        }
      } catch (e) {
        // mantém os dados de reserva
      }
      renderCategorias(categorias);
    })();
  </script>
</body>

</html>
