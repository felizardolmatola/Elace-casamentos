<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Entrar — Enlace</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="./assets/img/icons/icon.png">
<style>
  :root{
    --branco-gelo:#FFFFFF;
    --preto-grafite:#1F1F1F;
    --azul-claro:#0B4870;
    --verde-salvia:#A3B18A;
    --cinza-claro:#F5F5F5;
  }
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    font-family:'Inter',sans-serif;
    color:var(--preto-grafite);
    background:var(--branco-gelo);
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:manipulation;
  }

  button,
  a,
  input,
  select,
  textarea{
    touch-action:manipulation;
  }

  button,
  a{
    -webkit-tap-highlight-color:transparent;
  }
  .font-display{font-family:'Playfair Display',serif;}

  .btn-gold{
    background:var(--azul-claro);
    color:#FFFFFF;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-gold:hover{transform:translateY(-1px); box-shadow:0 10px 24px -8px rgba(11,72,112,.55);}
  .btn-gold:disabled{opacity:.6; transform:none; box-shadow:none; cursor:not-allowed;}

  .input-field{
    border:1.5px solid #E2E7EB;
    background:#F8FAFB;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    font-size:16px; /* evita o zoom automático do iOS/Android ao focar o campo */
  }
  @media (min-width:640px){
    .input-field{ font-size:0.875rem; } /* volta ao text-sm em ecrãs maiores, onde não há zoom automático */
  }
  .input-field:focus{
    outline:none;
    border-color:var(--azul-claro);
    background:#fff;
    box-shadow:0 0 0 4px rgba(11,72,112,.14);
  }
  .input-field.field-error{
    border-color:#C0524A;
    background:#FBF3F2;
  }

  .fade-up{animation:fadeUp .7s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .fade-up{animation:none;}
    .btn-gold:hover{transform:none;}
  }

  /* PAINEL DECORATIVO */
  .hero-img{
    animation:kenBurns 24s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes kenBurns{
    0%{   transform:scale(1)     translate(0,0); }
    100%{ transform:scale(1.12)  translate(-1.5%,-2%); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-img{ animation:none; }
  }

  .quote-mark{
    font-family:'Playfair Display',serif;
    color:rgba(255,255,255,.35);
    line-height:1;
  }

  .checkbox-gold{
    accent-color:var(--azul-claro);
  }

  .social-icon{
    border:1.5px solid rgba(11,72,112,.2);
    color:var(--azul-claro);
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .social-icon:hover{background:var(--azul-claro); color:#fff; border-color:var(--azul-claro);}

  /* Toast de sucesso */
  #toastSucesso{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    z-index:100; display:flex; align-items:center; gap:10px;
    background:var(--azul-claro); color:#fff; font-weight:600; font-size:.9rem;
    padding:14px 22px; border-radius:12px; box-shadow:0 14px 32px -10px rgba(11,72,112,.55);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  #toastSucesso.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<style id="button-contrast-fix">

/* === Correção de contraste dos botões === */
button,
a[role="button"],
.btn-gold,
.btn-outline-gold,
.cat-tab,
.cost-toggle-btn,
.account-toggle-btn,
.cat-chip,
.cost-chip {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.btn-gold {
  background: #0B4870 !important;
  color: #FFFFFF !important;
  border: 1px solid #0B4870 !important;
  font-weight: 600;
}

.btn-gold:hover,
.btn-gold:focus-visible {
  background: #083B5C !important;
  color: #FFFFFF !important;
}

.btn-outline-gold {
  background: #FFFFFF !important;
  color: #0B4870 !important;
  border: 1.5px solid #0B4870 !important;
  font-weight: 600;
}

.btn-outline-gold:hover,
.btn-outline-gold:focus-visible {
  background: #EAF3F8 !important;
  color: #073A59 !important;
}

.cat-tab {
  background: #FFFFFF;
  color: #1F1F1F !important;
  border-color: #0B4870 !important;
  font-weight: 600;
}

.cat-tab.active {
  background: #0B4870 !important;
  color: #FFFFFF !important;
  border-color: #0B4870 !important;
}

.cost-toggle-btn,
.account-toggle-btn {
  color: #444444 !important;
  font-weight: 600;
}

.cost-toggle-btn.active,
.account-toggle-btn.active {
  background: #FFFFFF !important;
  color: #0B4870 !important;
  font-weight: 700;
  border: 1px solid #0B4870;
}

.cat-chip,
.cost-chip {
  background: #FFFFFF;
  color: #1F1F1F !important;
  border-color: #667784 !important;
  font-weight: 600;
}

.cat-chip:hover,
.cost-chip:hover {
  background: #EAF3F8 !important;
  color: #073A59 !important;
  border-color: #0B4870 !important;
}

.cat-chip.selected {
  background: #0B4870 !important;
  color: #FFFFFF !important;
  border-color: #0B4870 !important;
}

.cost-chip.selected {
  background: #EAF3F8 !important;
  color: #073A59 !important;
  border-color: #0B4870 !important;
  font-weight: 700;
}

/* Botões comuns do Tailwind com texto branco sobre fundos claros */
button.bg-white.text-white,
a.bg-white.text-white {
  color: #1F1F1F !important;
}

/* Foco visível para acessibilidade */
button:focus-visible,
a[role="button"]:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(11,72,112,.35);
  outline-offset: 2px;
}

</style>
</head>
<body class="antialiased">

<!-- TOAST DE SUCESSO -->
<div id="toastSucesso" class="left-1/2 -translate-x-1/2" class="mb-24"role="status" aria-live="polite">
  <svg class="w-8 h-8 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
  </svg>
  <span id="toastSucessoTexto">Acesso concedido</span>
</div>

  <!-- CABEÇALHO -->
  <header class="relative bg-white sticky top-0 z-40">
    <!-- IMAGEM DE FUNDO NO LADO ESQUERDO DO HEADER -->
    <div class="pointer-events-none absolute left-0 top-0 h-full w-24 sm:w-60 lg:w-72 -z-10 overflow-hidden">
      <img src="./assets/img/icons/banner.png" alt=""
        class="h-full w-full object-cover object-[center_25%] sm:object-center" aria-hidden="true">
    </div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 h-[76px] sm:h-20 flex items-center justify-between">

      <!-- Botão menu hambúrguer -->
      <button id="mobileMenuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobileMenu"
              class="w-9 h-9 flex items-center justify-center rounded-xl shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Logotipo -->
      <a href="./index.html" class="flex items-center">
        <img src="./assets/img/icons/logo.png" alt="Enlace" class="h-12 sm:h-14 w-auto object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="font-display text-xl hidden" style="color:var(--azul-claro)">Enlace</span>
      </a>

      <!-- Seta para voltar ao index -->
      <a href="./index.html" aria-label="Voltar ao início" title="Voltar"
         class="h-9 px-2 flex items-center gap-1 rounded-xl shrink-0 hover:opacity-75 transition-opacity" style="color:var(--azul-claro)">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        <span class="text-sm font-medium">Voltar</span>
      </a>
    </div>

    <!-- Menu mobile -->
    <nav id="mobileMenu" class="hidden absolute left-0 right-0 top-full px-4 sm:px-6 pb-4 pt-3 bg-white border-b border-[#E2E7EB] shadow-lg z-30">
      <a href="./index.html" class="block px-2 py-2.5 rounded-xl text-[15px] font-medium hover:bg-[#F5F5F5] transition-colors">Início</a>
      <a href="login.html" class="block px-2 py-2.5 rounded-xl text-[15px] font-medium hover:bg-[#F5F5F5] transition-colors">Entrar</a>
      <a href="registo.html" class="block px-2 py-2.5 rounded-xl text-[15px] font-medium hover:bg-[#F5F5F5] transition-colors">Criar conta</a>
    </nav>
  </header>

  <div class="grid">

    <!-- COLUNA ESQUERDA — FORMULÁRIO -->
    <div class="min-h-screen flex flex-col justify-center px-6 sm:px-10 lg:px-16 py-8 lg:py-10" style="background:var(--cinza-claro)">

      <!-- Formulário -->
      <div class="w-full max-w-sm mx-auto fade-up bg-white rounded-xl border border-[#E2E7EB] shadow-sm px-6 py-8 sm:px-8 sm:py-9">

        <p class="uppercase tracking-[0.3em] text-xs font-semibold mb-3" style="color:var(--azul-claro)">Bem-vindos de volta</p>
        <h1 class="font-display text-3xl sm:text-4xl leading-tight">Entrar na vossa conta</h1>
        <p class="text-[#666] text-sm mt-3">
          Continuem o planejamento exatamente onde ficaram.
        </p>

        <form id="loginForm" class="mt-9 space-y-5" novalidate>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold mb-2">Email</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   class="input-field w-full rounded-xl px-4 py-3 text-sm"
                   placeholder="voces@exemplo.com" required>
            <p class="error-msg text-xs mt-1.5 hidden" style="color:#C0524A">Introduzam um email válido.</p>
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-sm font-semibold">Palavra-passe</label>
              <a href="#" class="text-xs font-medium hover:underline" style="color:var(--azul-claro)">Esqueceram-se?</a>
            </div>
            <div class="relative">
              <input type="password" id="password" name="password" autocomplete="current-password"
                     class="input-field w-full rounded-xl px-4 py-3 pr-11 text-sm"
                     placeholder="••••••••" required minlength="8">
              <button type="button" id="togglePassword" aria-label="Mostrar palavra-passe"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-[#999] hover:text-[#1F1F1F] transition-colors">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </button>
            </div>
            <p class="error-msg text-xs mt-1.5 hidden" style="color:#C0524A">A palavra-passe deve ter pelo menos 8 caracteres.</p>
          </div>

          <!-- Lembrar-me -->
          <div class="flex items-center gap-2.5 pt-1">
            <input type="checkbox" id="remember" name="remember" class="checkbox-gold w-4 h-4 rounded-xl">
            <label for="remember" class="text-sm text-[#555]">Manter sessão iniciada</label>
          </div>

          <!-- Mensagem geral -->
          <p id="formMsg" class="text-sm hidden" style="color:#C0524A"></p>

          <!-- Botão submeter -->
          <button type="submit" id="submitBtn"
                  class="btn-gold w-full py-3.5 rounded-xl text-sm font-semibold mt-2">
            Entrar
          </button>
        </form>

        <p class="text-center text-sm text-[#666] mt-9">
          Ainda não têm conta?
          <a href="registo.html" class="font-semibold hover:underline" style="color:var(--azul-claro)">Criar conta gratuita</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const formMsg = document.getElementById('formMsg');
      const toggleBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const API_BASE = window.ENLACE_API_BASE || 'https://elace-casamentos.onrender.com/api';

      // Mostrar/ocultar palavra-passe
      toggleBtn.addEventListener('click', () => {
        const isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword
          ? '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.243L9.88 9.88"/>'
          : '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';
        toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe');
      });

      function setError(field, hasError){
        const errorMsg = field.type === 'password'
          ? field.closest('div').parentElement.querySelector('.error-msg')
          : field.parentElement.querySelector('.error-msg');
        field.classList.toggle('field-error', hasError);
        if(errorMsg) errorMsg.classList.toggle('hidden', !hasError);
      }

      function validEmail(value){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      email.addEventListener('input', () => setError(email, false));
      password.addEventListener('input', () => setError(password, false));

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        formMsg.classList.add('hidden');

        let valid = true;
        if(!validEmail(email.value.trim())){
          setError(email, true);
          valid = false;
        }
        if(password.value.length < 8){
          setError(password, true);
          valid = false;
        }
        if(!valid) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'A entrar…';

        fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.value.trim(), password: password.value }),
        })
          .then(async (resp) => {
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || !data.ok) {
              throw new Error(data.erro || 'Credenciais inválidas.');
            }
            localStorage.setItem('enlace_token', data.token);
            localStorage.setItem('enlace_tipo', data.tipo);
            localStorage.setItem('enlace_usuario', JSON.stringify(data.usuario));

            const toast = document.getElementById('toastSucesso');
            document.getElementById('toastSucessoTexto').textContent = 'Acesso concedido';
            toast.classList.add('show');
            setTimeout(() => { window.location.href = '/'; }, 1400);
          })
          .catch((err) => {
            formMsg.textContent = err.message;
            formMsg.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
          });
      });
    })();

    // ALTERNAR MENU MOBILE (BOTÃO HAMBÚRGUER)
    (function(){
      const btn = document.getElementById('mobileMenuBtn');
      const menu = document.getElementById('mobileMenu');
      if(!btn || !menu) return;
      btn.addEventListener('click', () => {
        const isHidden = menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      });
    })();
  </script>

</body>
</html>
